<style>
/* Lista simples por cidade: abas por cargo, busca, candidato → locais → urnas. Sem Raio-X nem mapas. */
:root { color-scheme: light; --papel: #f3f5f8; --cartao: #fff; --tinta: #0e2238; --tinta2: #4a5568; --suave: #7d8796; --linha: #e2e6ec;
  --azul: #1c5cab; --azul-vivo: #2a78d6; --azul-fundo: #e8f0fb; --heroi: #0e2238; --heroi-sub: #a9bdd6;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; --f-corpo: "Public Sans", "Segoe UI", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--papel); color: var(--tinta); font: 16px/1.5 var(--f-corpo); }
.wrap { max-width: 900px; margin: 0 auto; padding-inline: 16px; }
.topo { background: #0a1a2c; }
.topo a { display: inline-block; color: #c9d6e6; text-decoration: none; font-size: 14px; padding: 10px 0; }
.heroi { background: var(--heroi); color: #fff; padding-block: 22px 26px; }
.eyebrow { font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--heroi-sub); font-weight: 600; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 4.5vw, 40px); line-height: 1.1; margin: 6px 0; text-wrap: balance; }
.heroi p { color: var(--heroi-sub); margin: 0; font-size: 15px; }
.fixo { position: sticky; top: 0; z-index: 10; background: var(--papel); padding-block: 12px 8px; }
.abas { display: flex; gap: 6px; overflow-x: auto; }
.abas button { flex: 1 0 auto; white-space: nowrap; font: 600 15px var(--f-corpo); padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--linha);
  background: var(--cartao); color: var(--tinta2); cursor: pointer; }
.abas .ativa { background: var(--azul); border-color: var(--azul); color: #fff; }
.busca { position: relative; margin-top: 8px; }
.busca input { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px 11px 38px; border-radius: 12px; border: 1.5px solid #b7d3f6; background: #fff; }
.busca svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--azul); }
.resumo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.rs { background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; padding: 8px 12px; }
.rs b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.rs span { font-size: 12px; color: var(--tinta2); }
.rs.ok b { color: #1d6b2c; } .rs.falta b { color: #9a4a17; }
.info { font-size: 13px; color: var(--tinta2); margin: 6px 2px 0; }
.lista { background: var(--cartao); border: 1px solid var(--linha); border-radius: 16px; overflow: hidden; margin: 8px 0 20px; }
.cand { border-bottom: 1px solid var(--linha); }
.cand:last-child { border-bottom: 0; }
.cab { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; width: 100%; text-align: left;
  background: none; border: 0; padding: 11px 14px; font: inherit; color: inherit; cursor: pointer; }
.cab:hover { background: #f7f9fc; }
.pos { color: var(--suave); font-size: 13px; font-variant-numeric: tabular-nums; }
.nm { font-weight: 600; overflow-wrap: anywhere; }
.nm small { font-weight: 500; color: var(--tinta2); margin-left: 4px; }
.sit { grid-column: 2; font-size: 12.5px; color: var(--tinta2); }
.sit.eleito { color: #0a7d0a; font-weight: 600; }
.v { grid-row: 1 / span 2; grid-column: 3; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.v small { display: block; font-weight: 400; color: var(--suave); font-size: 12px; }
.seta { display: inline-block; margin-left: 6px; color: var(--suave); transition: transform .15s; }
.cand.aberto .seta { transform: rotate(90deg); }
.cand.aberto .cab { background: var(--azul-fundo); }
.raiox { display: inline-block; margin-left: 6px; font-size: 12px; font-weight: 700; color: #fff; background: var(--azul); border-radius: 999px;
  padding: 1px 8px; text-decoration: none; vertical-align: 1px; }
.locais { padding: 4px 14px 12px 48px; }
.locais h4 { margin: 8px 0 4px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); }
.loc { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; width: 100%; background: none; border: 0; border-bottom: 1px dashed var(--linha);
  padding: 7px 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.loc .e { font-size: 14.5px; overflow-wrap: anywhere; }
.loc .b { font-size: 12.5px; color: var(--tinta2); grid-column: 1; }
.loc .q { grid-row: 1 / span 2; grid-column: 2; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14.5px; }
.loc.lugar .e { font-weight: 700; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.kpi { background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16); border-radius: 14px; padding: 10px 12px; }
.kpi b { display: block; font-family: var(--f-display); font-size: 24px; line-height: 1.1; }
.kpi span { font-size: 12.5px; color: var(--heroi-sub); }
.kpi.falta b { color: #ffc9a8; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.tag { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--papel); border: 1px solid var(--linha); color: var(--tinta2); white-space: nowrap; }
.tag.ok { background: #e7f6ea; border-color: #bfe3c6; color: #1d6b2c; }
.tag.falta { background: #fdf0e8; border-color: #f4d3bd; color: #9a4a17; }
.loc { padding: 10px 0; }
.loc .q { text-align: right; line-height: 1.1; }
.loc .q small { display: block; font-size: 11px; font-weight: 500; color: var(--suave); }
.loc.lugar { background: #fbfcfe; border-radius: 10px; padding: 10px 10px; margin-top: 4px; border-bottom: 0; }
.loc.lugar.aberto { background: var(--azul-fundo); }
.escolas .loc { border-bottom: 1px solid var(--linha); }
.urnas table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; background: #fff;
  border: 1px solid var(--linha); border-radius: 10px; overflow: hidden; }
.urnas th { background: var(--papel); color: var(--tinta2); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
.urnas th, .urnas td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--linha); }
.urnas th:first-child, .urnas td:first-child { text-align: left; }
.urnas td.falta { color: #9a4a17; }
.urnas tr:last-child td { border-bottom: 0; }
@media (max-width: 600px) { .locais { padding: 4px 8px 12px 10px; } .escolas { padding-left: 8px; margin-left: 0; } .urnas th, .urnas td { white-space: nowrap; } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi b { font-size: 20px; }
  .urnas th, .urnas td { padding: 5px 5px; font-size: 12px; } .urnas th { font-size: 10px; } }
.loc .e::after { content: " ›"; color: var(--suave); }
.loc.aberto .e::after { content: " ⌄"; }
.escolas { padding-left: 16px; border-left: 2px solid var(--azul-fundo); margin: 2px 0 6px 4px; }
.urnas { display: block; padding: 4px 0 10px; overflow-x: auto; max-width: 100%; }
[hidden] { display: none !important; }
.urnas-velho span { font-size: 12.5px; background: var(--papel); border: 1px solid var(--linha); border-radius: 8px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.urnas b { font-weight: 700; }
.vazio { padding: 16px; color: var(--tinta2); }
footer { color: var(--suave); font-size: 13px; padding-block: 0 32px; }
@media (max-width: 600px) { .locais { padding-left: 14px; } .cab { padding: 10px 12px; } }
</style>

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n ?? 0).toLocaleString('pt-BR');
const pc = (a, b) => b ? (100 * a / b).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%' : '–';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tt = s => String(s ?? '').toLowerCase().replace(/(^|[\s\-/('])(\p{L})/gu, (m, a, b) => a + b.toUpperCase())
  .replace(/\b(De|Da|Do|Das|Dos|E)(?=\s)|\bD(?=')/g, w => w.toLowerCase()).replace(/\b(Ii|Iii|Iv)\b/g, w => w.toUpperCase());
const semAc = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

$('sub').textContent = `Presidente, Senador, Deputado Federal e Deputado Estadual · ${D.urnas} urnas em ${D.escolas.length} locais de votação. Toque num candidato para ver onde foi votado.`;
const abst = D.aptos - D.votantes;
$('kpis').innerHTML = [[fmt(D.aptos), 'eleitores'], [fmt(D.votantes), `votaram · ${pc(D.votantes, D.aptos)}`],
  [fmt(abst), `não votaram · ${pc(abst, D.aptos)}`, 'falta'], [D.urnas, 'urnas']]
  .map(([n, t, c = '']) => `<div class="kpi ${c}"><b>${n}</b><span>${t}</span></div>`).join('');
// etiquetas de comparecimento: eleitores · votaram · não votaram
const comp = (aptos, votaram) => `<span class="tags"><span class="tag">${fmt(aptos)} eleitores</span>` +
  `<span class="tag ok">${fmt(votaram)} votaram</span><span class="tag falta">${fmt(aptos - votaram)} não votaram · ${pc(aptos - votaram, aptos)}</span></span>`;
$('rodape').textContent = 'Fonte: Tribunal Superior Eleitoral (TSE) — votação por seção de 2026 (dados abertos), boletins de urna (presidente), totalização oficial e cadastro de locais de votação. Percentuais sobre os votos válidos do cargo na cidade.';

let cargo = D.cargos.find(c => c.cd === 6) || D.cargos[0];
$('abas').innerHTML = D.cargos.map(c => `<button role="tab" data-c="${c.cd}">${c.nome}</button>`).join('');
$('abas').onclick = e => { const b = e.target.closest('button'); if (!b) return; cargo = D.cargos.find(c => c.cd == b.dataset.c); $('busca').value = ''; render(); };

// candidato → localidade (bairro/povoado) → escola → urnas
const nomeCurto = c => tt(c.nm).split(' ').slice(0, 2).join(' ');
function locais(c) {
  const esc_ = new Map();
  for (const [ei, sec, q] of c.u) { const o = esc_.get(ei) || { ei, v: 0, u: [] }; o.v += q; o.u.push([sec, q]); esc_.set(ei, o); }
  const loc = new Map();
  for (const o of esc_.values()) {
    const nome = (D.escolas[o.ei] || ['', 'Localidade não identificada'])[1] || 'Localidade não identificada';
    const L = loc.get(nome) || { nome, v: 0, esc: [] }; L.v += o.v; L.esc.push(o); loc.set(nome, L);
  }
  for (const L of loc.values()) {   // eleitores da localidade = soma de todas as escolas dela (não só onde teve voto)
    L.aptos = 0; L.votaram = 0;
    for (const e of D.escolas) if ((e[1] || 'Localidade não identificada') === L.nome) { L.aptos += e[2] || 0; L.votaram += e[3] || 0; }
  }
  const ls = [...loc.values()].sort((a, b) => b.v - a.v);
  return `<h4>Onde foi votado em ${esc(tt(D.cidade))} · ${ls.length} ${ls.length === 1 ? 'localidade' : 'localidades'} · ${esc_.size} ${esc_.size === 1 ? 'local de votação' : 'locais de votação'}</h4>` +
    ls.map(L => `<button class="loc lugar" type="button"><span class="e">${esc(tt(L.nome))}</span>
        <span class="b">${L.esc.length} ${L.esc.length === 1 ? 'local de votação' : 'locais de votação'}${comp(L.aptos, L.votaram)}</span>
        <span class="q">${fmt(L.v)}<small>${L.v === 1 ? 'voto' : 'votos'}</small></span></button>
      <div class="escolas" hidden>${L.esc.sort((a, b) => b.v - a.v).map(o => `<button class="loc escola" type="button">
          <span class="e">${esc(tt((D.escolas[o.ei] || ['Local não identificado'])[0]))}</span>
          <span class="b">${(D.escolas[o.ei] || [])[4] || o.u.length} urnas na escola${comp((D.escolas[o.ei] || [])[2] || 0, (D.escolas[o.ei] || [])[3] || 0)}</span>
          <span class="q">${fmt(o.v)}<small>${o.v === 1 ? 'voto' : 'votos'}</small></span></button>
        <div class="urnas" hidden><table><thead><tr><th>Seção</th><th>Eleitores</th><th>Votaram</th><th>Não votaram</th><th>Brancos</th><th>Nulos</th><th>Votos</th></tr></thead><tbody>
          ${o.u.sort((a, b) => a[0] - b[0]).map(([sec, q]) => {
            const [ap, vt] = D.eleitores[`${o.ei}-${sec}`] || [];
            return `<tr><td>${sec}</td><td>${fmt(ap)}</td><td>${fmt(vt)}</td><td class="falta">${ap != null ? fmt(ap - vt) : '–'}</td><td>${fmt((cargo.bn[`${o.ei}-${sec}`] || [0])[0])}</td><td>${fmt((cargo.bn[`${o.ei}-${sec}`] || [0, 0])[1])}</td><td><b>${fmt(q)}</b></td></tr>`;
          }).join('')}</tbody></table></div>`).join('')}</div>`).join('');
}

function render() {
  document.querySelectorAll('#abas button').forEach(b => b.classList.toggle('ativa', +b.dataset.c === cargo.cd));
  const t = semAc($('busca').value.trim());
  let pos = 0;
  const linhas = cargo.cand.map(c => ({ c, pos: c.a ? '—' : ++pos })).filter(({ c }) => !t || semAc(c.nm + ' ' + c.p + ' ' + c.n).includes(t));
  const tot = cargo.validos + cargo.brancos + cargo.nulos;
  $('resumo').innerHTML = [['Válidos', cargo.validos, 'ok'], ['Brancos', cargo.brancos, ''], ['Nulos', cargo.nulos, 'falta']]
    .map(([t, n, k]) => `<div class="rs ${k}"><b>${fmt(n)}</b><span>${t} · ${pc(n, tot)}</span></div>`).join('');
  $('info').textContent = `${cargo.nome}: ${cargo.cand.length} candidatos tiveram votos · ${fmt(cargo.validos)} votos válidos` +
    (cargo.legenda ? ` (incluindo ${fmt(cargo.legenda)} de legenda)` : '') + (cargo.nome === 'Senador' ? ' · Em 2026 foram duas vagas: cada eleitor votou em dois senadores, por isso há mais votos que eleitores que votaram' : '') + (t ? ` · ${linhas.length} encontrados` : '');
  $('lista').innerHTML = linhas.map(({ c, pos }) => `<div class="cand" data-n="${c.n}">
      <button class="cab" type="button" aria-expanded="false">
        <span class="pos">${pos}${pos !== '—' ? 'º' : ''}</span>
        <span class="nm">${esc(tt(c.nm))} <small>${esc(c.p)} · ${c.n}</small>${c.slug ? `<a class="raiox" href="../../${c.slug}/">Raio-X ›</a>` : ''}</span>
        <span class="v">${fmt(c.v)}<span class="seta">›</span><small>${c.a ? 'anulados' : pc(c.v, cargo.validos)}</small></span>
        <span class="sit ${/^eleit/i.test(c.s) ? 'eleito' : ''}">${esc(c.s)}</span>
      </button>
      <div class="locais" hidden></div></div>`).join('') || '<p class="vazio">Nenhum candidato encontrado.</p>';
}
$('busca').addEventListener('input', render);
$('lista').addEventListener('click', e => {
  if (e.target.closest('.raiox')) return;
  const loc = e.target.closest('.loc');
  if (loc) { const u = loc.nextElementSibling; u.hidden = !u.hidden; loc.classList.toggle('aberto', !u.hidden); return; }
  const cab = e.target.closest('.cab'); if (!cab) return;
  const el = cab.parentElement, box = el.querySelector('.locais');
  if (box.hidden && !box.innerHTML) box.innerHTML = locais(cargo.cand.find(c => c.n == el.dataset.n));
  box.hidden = !box.hidden; el.classList.toggle('aberto', !box.hidden); cab.setAttribute('aria-expanded', String(!box.hidden));
});
render();
</script>
